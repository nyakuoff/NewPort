<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nyaku. — work</title>
  <meta name="description" content="nyaku — i make things, break things, and occasionally finish them. games, tools, systems and sound.">
  <meta name="theme-color" content="#0a0a0b">
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

  <header class="top">
    <a class="logo" href="index.html" data-render="logo"></a>
    <span class="status"><i class="dot"></i><span data-t="status"></span></span>
    <nav>
      <a href="index.html" aria-current="page">work</a>
      <a href="about.html">about</a>
      <a href="elsewhere.html">elsewhere</a>
      <a href="terminal.html">terminal</a>
    </nav>
  </header>

  <main class="split">
    <div class="main">
      <section class="hero">
        <div>
          <p class="prompt" data-t="home.prompt"></p>
          <h1><span data-t="home.title"></span><span class="cur"></span></h1>
          <p class="lead" data-t="home.lead"></p>
        </div>
        <svg class="art cat" aria-hidden="true"><use href="assets/icons.svg#cat"/></svg>
      </section>

      <section>
        <p class="prompt" data-t="home.doPrompt"></p>
        <p data-t="home.doText"></p>
      </section>

      <section>
        <p class="prompt" data-t="home.workPrompt"></p>
        <ul class="rows" data-render="work"></ul>
      </section>

      <section>
        <p class="prompt" data-t="home.nowPrompt"></p>
        <p class="now"><svg class="i"><use href="assets/icons.svg#arrow-r"/></svg><span data-t="home.now"></span></p>
      </section>
    </div>

    <aside class="side">
      <div class="player">
        <div class="player-top">
          <div class="cover" data-p="cover" aria-hidden="true"></div>
          <div class="info">
            <b data-p="title"></b>
            <small data-p="artist"></small>
          </div>
          <div class="top-actions">
            <div class="vol">
              <button class="ic" data-p="mute" aria-label="mute"><svg class="i"><use href="assets/icons.svg#volume"/></svg></button>
              <div class="vol-pop">
                <input type="range" data-p="vol" min="0" max="100" value="30" aria-label="volume" orient="vertical">
                <span data-p="volnum">30%</span>
              </div>
            </div>
          </div>
        </div>
        <div class="controls">
          <button class="ic" data-p="shuffle" aria-label="shuffle" aria-pressed="false"><svg class="i"><use href="assets/icons.svg#shuffle"/></svg></button>
          <button class="ic" data-p="prev" aria-label="previous"><svg class="i"><use href="assets/icons.svg#prev"/></svg></button>
          <button class="play" data-p="play" aria-label="play"><svg class="i"><use href="assets/icons.svg#play"/></svg></button>
          <button class="ic" data-p="next" aria-label="next"><svg class="i"><use href="assets/icons.svg#next"/></svg></button>
          <button class="ic" data-p="repeat" aria-label="repeat" aria-pressed="false"><svg class="i"><use href="assets/icons.svg#repeat"/></svg></button>
        </div>
        <div class="seek">
          <span data-p="cur">0:00</span>
          <div class="wave" data-p="wave" role="slider" aria-valuemin="0" aria-valuemax="100" tabindex="0" aria-label="seek"></div>
          <span data-p="dur">0:00</span>
        </div>
      </div>

      <div class="term" data-render="term" data-src="home.terminal"></div>

      <section class="interests">
        <p class="prompt" data-t="home.interestsPrompt"></p>
        <ul class="tags" data-render="tags"></ul>
      </section>

      <svg class="art mascot" aria-hidden="true"><use href="assets/icons.svg#mascot"/></svg>
    </aside>
  </main>

  <footer data-render="footer"></footer>

</div>
<script src="js/content.js"></script>
<script src="js/render.js"></script>
<script src="js/player.js"></script>
<script src="js/terminal.js"></script>
<script src="js/nav.js"></script>
</body>
</html>
